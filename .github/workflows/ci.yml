name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out the compatible MalaClaw runtime
        uses: actions/checkout@v4
        with:
          repository: gozhiyuan/MalaClaw
          # Pin the immutable commit behind a MalaClaw *release*, not a branch
          # and not the tag itself. A tag is mutable — `git tag -f && push -f`
          # relocates it, and the steps below run `npm ci` + `npm run build`
          # against whatever it points to, executing lifecycle scripts. A sha
          # cannot be relocated.
          #
          # This still only moves when MalaClaw cuts a release, which is the
          # point: runtime-compatibility.json declares ">=2.0.0 <3.0.0", and
          # each bump here is one reviewable line recording which release was
          # actually tested. Bump with:
          #   git -C <malaclaw> rev-parse v<next>^{commit}
          ref: 810163c097467b8aeed659f0214a033f36ccec23 # MalaClaw v2.2.0
          path: .dependencies/MalaClaw
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Pin the interpreter that `npm test` shells out to. The bootstrap parity
      # test compares Python against the TypeScript auditor bit-for-bit, and
      # CPython changed float `sum()` to compensated summation in 3.12 — so the
      # guard is only meaningful on >=3.12. An unpinned runner would silently
      # move that boundary. See packages/longexperiment/tests/statistics-parity.test.ts.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build MalaClaw runtime
        run: |
          npm ci --prefix .dependencies/MalaClaw
          npm run build --prefix .dependencies/MalaClaw
      # Ahead of `npm ci`: a drifted internal range makes that step fail with a
      # 404 for a package never published to the registry, which says nothing
      # about the real cause. Naming it first turns a confusing install error
      # into a one-line diagnosis.
      - name: Check workspace version coherence
        run: npm run check:versions
      - run: npm ci
      - run: npm run build
      # Stdlib unittest only — the experiment runner protocol deliberately has
      # no third-party dependencies so a candidate image can execute it.
      - name: Test LongExperiment Python runner protocol
        working-directory: packages/longexperiment/python
        run: python -m unittest discover -s tests -v
      - name: Test MrMaLiang with its pinned MalaClaw runtime
        run: npm test
        env:
          MALACLAW_SOURCE_DIR: ${{ github.workspace }}/.dependencies/MalaClaw
      # The golden suites compare compiled manifests against themselves, so an
      # invalid manifest can stay frozen and green. This scaffolds real
      # workspaces, validates each through the engine, and executes a
      # prescribed experiment with a deterministic local runner.
      - name: Execution smoke
        run: npm run smoke:execution
        env:
          MALACLAW_SOURCE_DIR: ${{ github.workspace }}/.dependencies/MalaClaw
      - run: npm run maliang -- template list
